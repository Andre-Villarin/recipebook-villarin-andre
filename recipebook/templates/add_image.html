<!DOCTYPE html>
<html>

{% extends 'base.html' %}

{% block title %} Post Recipe {% endblock %}

{% block content %}
    <h2>
        Post Image for {{ recipe.id }}
    </h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>   

    <br>
    <a href="{% url 'recipe_list' %}">Back to Recipe List</a>
{% endblock %}
</html>
