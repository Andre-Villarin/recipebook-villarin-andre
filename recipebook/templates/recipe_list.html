<!DOCTYPE html>
<html>
{% extends 'base.html' %}

{% block title %} Home {% endblock %}

{% block content %}
    <h2>Recipe Directory</h2>
    <i>Click any of the links below to be redirected to a recipe.</i>
    <ul>    
        {% for recipe in recipes %}
        <li>{{ recipe.name }} <i>
        {% endfor %}
    </ul>
{% endblock %}
</html>
